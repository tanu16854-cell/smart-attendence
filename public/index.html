<!DOCTYPE html>
<html>
<head>
    <title>Smart ERP Attendance System</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="logo">
        SMART ERP
    </div>

    <ul>
        <li onclick="showSection('dashboard')">
            🏠 Dashboard
        </li>

        <li onclick="showSection('teacher')">
            👨‍🏫 Teacher Panel
        </li>

        <li onclick="showSection('attendance')">
            📅 Attendance
        </li>

        <li onclick="showSection('report')">
            📊 Reports
        </li>
    </ul>

</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- HEADER -->
    <div class="erp-header">

        <div>
            <h1>Smart ERP Attendance System</h1>
            <p>School / College Management Dashboard</p>
        </div>

        <div class="datetime-box">
            <div id="liveDate"></div>
            <div id="liveTime"></div>
        </div>

    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="section active-section">

        <!-- ADD STUDENT -->
        <div class="box">

            <h2>Add Student</h2>

            <input type="text"
                   id="id"
                   placeholder="Enter Student ID">

            <input type="text"
                   id="name"
                   placeholder="Enter Student Name">

            <button onclick="addStudent()">
                Add Student
            </button>

        </div>

       <!-- REPORT -->
<div id="report" class="section">

    <div class="box">

        <h2>📊 Monthly Attendance Report</h2>

        <input type="month" id="reportMonth">

        <button onclick="loadMonthlyReport()">
            View Monthly Report
        </button>

        <table id="reportTable">

            <tr>
                <th>Date</th>
                <th>Student ID</th>
                <th>Name</th>
                <th>Status</th>
            </tr>

        </table>

    </div>

</div>

    <!-- TEACHER PANEL -->
    <div id="teacher" class="section">

        <div class="box">

            <h2>👨‍🏫 Teacher Panel</h2>

            <input type="text"
                   placeholder="Teacher Name">

            <input type="text"
                   placeholder="Subject">

            <input type="text"
                   placeholder="Class">

            <button>
                Add Teacher
            </button>

        </div>

    </div>

    <!-- ATTENDANCE -->
    <div id="attendance" class="section">

        <div class="box">

            <h2>📅 Monthly Attendance</h2>

            <!-- DATE -->
            <div class="date-box">

                <label>Select Attendance Date</label>

                <input type="date"
                       id="attendanceDate">

            </div>

            <!-- STUDENT LIST -->
            <div id="studentList"></div>

            <button onclick="submitAttendance()">
                Submit Attendance
            </button>

        </div>

    </div>

    <!-- REPORT -->
    <div id="report" class="section">

        <div class="box">

            <h2>📊 Attendance Reports</h2>

            <button onclick="loadReport()">
                View Report
            </button>

            <table id="reportTable"></table>

        </div>

    </div>

</div>

<script src="script.js"></script>

<script>

/* LOGIN CHECK */

if (!localStorage.getItem("login")) {
    window.location = "login.html";
}

/* ERP SECTION SWITCH */

function showSection(id){

    document.querySelectorAll(".section")
    .forEach(sec=>{
        sec.classList.remove("active-section");
    });

    document.getElementById(id)
    .classList.add("active-section");
}

/* LIVE DATE & TIME */

function updateDateTime(){

    const now = new Date();

    document.getElementById("liveDate").innerHTML =
        now.toDateString();

    document.getElementById("liveTime").innerHTML =
        now.toLocaleTimeString();
}

setInterval(updateDateTime,1000);

updateDateTime();

</script>

</body>
</html>
